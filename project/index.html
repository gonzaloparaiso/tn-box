<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TN BOX — Programación profesional para boxes de entrenamiento funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f5f5f3;
    --bg-3: #ebebe8;
    --bg-dark: #0a0a0a;
    --bg-dark-2: #161614;
    --fg: #0a0a0a;
    --fg-dim: #525252;
    --fg-mute: #8a8a87;
    --fg-on-dark: #f8f8f6;
    --fg-on-dark-dim: #b5b5b1;
    --line: #e5e5e2;
    --line-dark: #2a2a27;
    --accent: #F3C148;
    --accent-soft: #fff5d6;
    --accent-fg: #0a0a0a;
    --radius: 6px;
    --maxw: 1280px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  .display { font-family: "Montserrat", sans-serif; font-weight: 900; letter-spacing: -0.025em; line-height: 0.98; text-transform: uppercase; padding-bottom: 0.06em; }
  .display + p, .display + .sub, .display + .lead { margin-top: 28px !important; }
  .mono { font-family: "JetBrains Mono", "Menlo", monospace; }
  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; max-width: 100%; }
  ::selection { background: var(--accent); color: var(--accent-fg); }

  /* utility */
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg); display: inline-flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; display: block; width: 24px; height: 2px; background: var(--accent); }
  .eyebrow.on-dark { color: var(--fg-on-dark); }
  .eyebrow.on-yellow::before { background: var(--accent-fg); }

  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; border-radius: var(--radius); transition: transform .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease; border: 2px solid transparent; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); box-shadow: 0 8px 0 0 rgba(10,10,10,0.08); }
  .btn-primary:hover { background: #ffd363; border-color: #ffd363; box-shadow: 0 4px 0 0 rgba(10,10,10,0.12); }
  .btn-dark { background: var(--bg-dark); color: var(--fg-on-dark); border-color: var(--bg-dark); }
  .btn-dark:hover { background: #1f1f1c; border-color: #1f1f1c; }
  .btn-ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
  .btn-ghost:hover { border-color: var(--fg); }
  .btn-ghost.on-dark { color: var(--fg-on-dark); border-color: var(--line-dark); }
  .btn-ghost.on-dark:hover { border-color: var(--fg-on-dark); }
  .arrow { transition: transform .2s ease; display: inline-block; }
  .btn:hover .arrow { transform: translateX(3px); }

  .placeholder {
    background:
      repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,0.05) 8px 9px),
      var(--bg-3);
    color: var(--fg-mute);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* Promo bar */
  .promo-bar { background: var(--bg-dark); color: var(--fg-on-dark); text-align: center; padding: 10px 24px; font-size: 13px; font-weight: 500; letter-spacing: 0.01em; }
  .promo-bar strong { color: var(--accent); font-weight: 700; }

  /* Nav */
  nav.top {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav.top .inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: var(--maxw); margin: 0 auto; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 900; text-transform: uppercase; font-size: 18px; letter-spacing: 0.04em; }
  .logo-img { width: 44px; height: 44px; background: var(--bg-dark); border-radius: 50%; padding: 4px; display: grid; place-items: center; }
  .logo-img img { width: 100%; height: 100%; object-fit: contain; }
  .nav-links { display: flex; gap: 28px; font-size: 13px; font-weight: 600; color: var(--fg-dim); }
  .nav-links a:hover { color: var(--fg); }
  @media (max-width: 900px) { .nav-links { display: none; } }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: var(--bg-dark); color: var(--fg-on-dark); }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 60% at 80% 30%, rgba(243,193,72,0.15) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero-inner { display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; padding: 88px 24px 96px; max-width: var(--maxw); margin: 0 auto; align-items: center; position: relative; z-index: 1; }
  @media (max-width: 980px) { .hero-inner { grid-template-columns: 1fr; gap: 48px; padding: 56px 24px 64px; } }
  .hero h1 { font-size: clamp(46px, 6.8vw, 92px); margin-top: 22px; }
  .hero h1 .accent { color: var(--accent); }
  .hero .sub { margin-top: 28px; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.55; color: var(--fg-on-dark-dim); max-width: 560px; }
  .hero-ctas { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-trust { margin-top: 44px; display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
  .hero-trust .stat { display: flex; flex-direction: column; gap: 4px; }
  .hero-trust .stat .num { font-weight: 900; font-size: 34px; color: var(--accent); line-height: 1; letter-spacing: -0.02em; }
  .hero-trust .stat .lbl { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-on-dark-dim); }
  .hero-trust .divider { width: 1px; height: 40px; background: var(--line-dark); }

  .hero-visual { position: relative; aspect-ratio: 4/5; border-radius: var(--radius); overflow: hidden; }
  .hero-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-visual .frame { position: absolute; inset: 0; border: 1px solid rgba(243,193,72,0.3); border-radius: var(--radius); pointer-events: none; }
  .hero-visual .badge {
    position: absolute; bottom: 24px; left: 24px; right: 24px;
    background: var(--accent); color: var(--accent-fg); padding: 16px 20px; border-radius: var(--radius);
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }
  .hero-visual .badge .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-fg); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .hero-visual .badge .txt { font-size: 13px; line-height: 1.3; }
  .hero-visual .badge .txt strong { display: block; font-weight: 800; }
  .hero-visual .badge .txt span { font-size: 12px; opacity: 0.8; }

  /* Logo strip */
  .strip { padding: 28px 24px; border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark); background: var(--bg-dark); color: var(--fg-on-dark-dim); }
  .strip-inner { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: space-between; }
  .strip .label { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .strip .label strong { color: var(--accent); font-weight: 600; }
  .strip .logos { display: flex; gap: 36px; flex-wrap: wrap; align-items: center; }
  .strip .logo-item { font-weight: 800; font-size: 16px; color: var(--fg-on-dark); letter-spacing: 0.02em; opacity: 0.65; text-transform: uppercase; }

  /* Section base */
  section.block { padding: 100px 24px; }
  @media (max-width: 720px) { section.block { padding: 64px 24px; } }
  .block-head { max-width: 860px; margin: 0 auto 64px; text-align: center; }
  .block-head .eyebrow { display: inline-flex; }
  .block-head h2 { font-size: clamp(40px, 5.4vw, 68px); margin-top: 20px; }
  .block-head .lead { margin-top: 24px; font-size: 17px; line-height: 1.6; color: var(--fg-dim); }
  .block-head .lead.on-dark { color: var(--fg-on-dark-dim); }

  /* Pain section */
  .pain { background: var(--bg); }
  .pain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); max-width: var(--maxw); margin: 0 auto; border-radius: var(--radius); overflow: hidden; }
  @media (max-width: 820px) { .pain-grid { grid-template-columns: 1fr; } }
  .pain-card { background: var(--bg); padding: 40px 32px; min-height: 280px; display: flex; flex-direction: column; justify-content: space-between; transition: background .2s ease; }
  .pain-card:hover { background: var(--bg-2); }
  .pain-card .num { font-weight: 900; font-size: 60px; color: var(--accent); line-height: 1; letter-spacing: -0.04em; }
  .pain-card .ttl { font-weight: 800; text-transform: none; font-size: 21px; line-height: 1.25; margin-top: 20px; letter-spacing: -0.01em; }
  .pain-card .desc { color: var(--fg-dim); font-size: 14.5px; line-height: 1.6; margin-top: 12px; }

  /* Solution */
  .solution { background: var(--bg-2); }
  .solution-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; max-width: var(--maxw); margin: 0 auto; }
  @media (max-width: 880px) { .solution-grid { grid-template-columns: 1fr; gap: 40px; } }
  .solution-img { aspect-ratio: 1/1; border-radius: var(--radius); overflow: hidden; position: relative; }
  .solution-img img { width: 100%; height: 100%; object-fit: cover; }
  .solution-img .tag { position: absolute; top: 20px; left: 20px; background: var(--accent); color: var(--accent-fg); padding: 8px 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 4px; }
  .solution-bullets { margin-top: 32px; display: flex; flex-direction: column; gap: 22px; }
  .bullet { display: flex; gap: 18px; align-items: flex-start; }
  .bullet .icon { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg); font-weight: 900; font-size: 16px; }
  .bullet .ttl { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .bullet .desc { color: var(--fg-dim); font-size: 14.5px; line-height: 1.6; margin-top: 4px; }

  /* Programs grid */
  .programs { background: var(--bg-dark); color: var(--fg-on-dark); }
  .programs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: var(--maxw); margin: 0 auto; }
  @media (max-width: 980px) { .programs-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .programs-grid { grid-template-columns: 1fr; } }
  .prog-card { background: var(--bg-dark-2); border: 1px solid var(--line-dark); padding: 26px; border-radius: var(--radius); position: relative; overflow: hidden; transition: border-color .2s ease, transform .2s ease, background .2s ease; }
  .prog-card:hover { border-color: var(--accent); transform: translateY(-4px); background: #1c1c19; }
  .prog-card .tag { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
  .prog-card .name { font-weight: 900; text-transform: uppercase; font-size: 24px; margin-top: 12px; letter-spacing: -0.01em; }
  .prog-card .desc { color: var(--fg-on-dark-dim); font-size: 13.5px; line-height: 1.55; margin-top: 12px; }
  .prog-card .corner { position: absolute; top: 22px; right: 22px; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: var(--maxw); margin: 0 auto; }
  @media (max-width: 880px) { .steps { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .steps { grid-template-columns: 1fr; } }
  .step { padding-top: 28px; border-top: 3px solid var(--accent); }
  .step .num { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.14em; color: var(--accent-fg); background: var(--accent); padding: 4px 10px; border-radius: 4px; display: inline-block; font-weight: 700; }
  .step .ttl { font-weight: 800; text-transform: none; font-size: 22px; margin-top: 14px; line-height: 1.25; letter-spacing: -0.01em; }
  .step .desc { color: var(--fg-dim); font-size: 14px; line-height: 1.6; margin-top: 12px; }

  /* Testimonials */
  .testimonials { background: var(--bg); }
  .test-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: var(--maxw); margin: 0 auto; }
  @media (max-width: 880px) { .test-grid { grid-template-columns: 1fr; } }
  .test-card {
    position: relative; background: var(--bg-dark); border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16/10; cursor: pointer; transition: transform .25s ease;
  }
  .test-card:hover { transform: translateY(-3px); }
  .test-card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .test-card .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0) 30%, rgba(10,10,10,0.85) 100%);
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .test-card.playing .overlay { opacity: 0; }
  .test-card .play-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
    display: grid; place-items: center; transition: transform .2s ease, opacity .2s ease;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .test-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.08); }
  .test-card.playing .play-btn { opacity: 0; pointer-events: none; }
  .test-card .play-btn svg { width: 28px; height: 28px; margin-left: 4px; }
  .test-card .meta {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 24px; color: var(--fg-on-dark);
    transition: opacity .25s ease;
  }
  .test-card.playing .meta { opacity: 0; }
  .test-card .meta .stars { color: var(--accent); letter-spacing: 2px; font-size: 13px; }
  .test-card .meta .name { font-weight: 800; font-size: 17px; margin-top: 6px; letter-spacing: -0.01em; }
  .test-card .meta .role { font-size: 13px; color: var(--fg-on-dark-dim); margin-top: 2px; }

  /* Authority */
  .authority { background: var(--bg-2); }
  .auth-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 64px; max-width: var(--maxw); margin: 0 auto; align-items: center; }
  @media (max-width: 880px) { .auth-grid { grid-template-columns: 1fr; gap: 36px; } }
  .auth-img { aspect-ratio: 4/5; border-radius: var(--radius); overflow: hidden; }
  .auth-img img { width: 100%; height: 100%; object-fit: cover; }
  .auth-credentials { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; }
  .cred { background: var(--bg); border: 1px solid var(--line); padding: 22px; border-radius: var(--radius); }
  .cred .v { font-weight: 900; font-size: 36px; line-height: 1; color: var(--fg); letter-spacing: -0.03em; }
  .cred .v .acc { color: var(--accent); }
  .cred .l { font-size: 13px; color: var(--fg-dim); margin-top: 10px; line-height: 1.4; }

  /* Pricing */
  .pricing { background: var(--bg); }
  .price-grid { display: grid; grid-template-columns: 1fr 1.05fr 1fr; gap: 18px; max-width: 1100px; margin: 0 auto; align-items: stretch; }
  @media (max-width: 880px) { .price-grid { grid-template-columns: 1fr; } }
  .price-card { background: var(--bg); border: 1px solid var(--line); padding: 36px; border-radius: var(--radius); display: flex; flex-direction: column; position: relative; }
  .price-card.featured { background: var(--bg-dark); color: var(--fg-on-dark); border-color: var(--bg-dark); transform: scale(1.03); z-index: 1; }
  @media (max-width: 880px) { .price-card.featured { transform: none; } }
  .price-card .badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 6px 14px; border-radius: 20px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
  .price-card .plan { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-mute); }
  .price-card.featured .plan { color: var(--accent); }
  .price-card .name { font-weight: 900; text-transform: uppercase; font-size: 30px; margin-top: 8px; letter-spacing: -0.02em; }
  .price-card .price { display: flex; align-items: baseline; gap: 6px; margin-top: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .price-card.featured .price { border-color: var(--line-dark); }
  .price-card .price .amount { font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -0.03em; }
  .price-card .price .per { color: var(--fg-dim); font-size: 14px; }
  .price-card.featured .price .per { color: var(--fg-on-dark-dim); }
  .price-card ul { list-style: none; margin-top: 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .price-card li { display: flex; gap: 12px; font-size: 14px; line-height: 1.5; color: var(--fg-dim); }
  .price-card.featured li { color: var(--fg-on-dark-dim); }
  .price-card li::before { content: ""; display: block; width: 18px; height: 18px; flex: 0 0 18px; background: var(--accent); margin-top: 1px; border-radius: 50%; clip-path: polygon(0 50%, 30% 80%, 100% 10%, 90% 0, 30% 60%, 10% 40%); }
  .price-card .cta-wrap { margin-top: 28px; }
  .price-card .cta-wrap .btn { width: 100%; justify-content: center; }

  /* FAQ */
  .faq-wrap { background: var(--bg-2); }
  .faq { max-width: 860px; margin: 0 auto; }
  .faq-item { border-bottom: 1px solid var(--line); }
  .faq-item button { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 26px 0; font-size: 18px; font-weight: 700; gap: 24px; letter-spacing: -0.01em; }
  .faq-item .plus { width: 32px; height: 32px; border: 1.5px solid var(--line); border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; transition: transform .25s ease, background .2s ease, color .2s ease, border-color .2s ease; font-size: 18px; line-height: 1; background: var(--bg); }
  .faq-item.open .plus { transform: rotate(45deg); background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .faq-item .answer { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .faq-item.open .answer { max-height: 400px; }
  .faq-item .answer-inner { padding: 0 0 26px; color: var(--fg-dim); font-size: 15.5px; line-height: 1.65; max-width: 720px; }

  /* CTA final */
  .final-cta { background: var(--accent); color: var(--accent-fg); padding: 110px 24px; text-align: center; position: relative; overflow: hidden; }
  .final-cta::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,255,255,0.4) 0%, transparent 60%);
    pointer-events: none;
  }
  .final-cta > * { position: relative; z-index: 1; }
  .final-cta h2 { font-size: clamp(46px, 6.5vw, 84px); }
  .final-cta .sub { margin-top: 22px; font-size: 18px; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.6; font-weight: 500; }
  .final-cta .ctas { margin-top: 40px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .final-cta .btn-dark { background: var(--bg-dark); color: var(--accent); border-color: var(--bg-dark); }
  .final-cta .btn-dark:hover { background: #1f1f1c; }
  .final-cta .btn-ghost { color: var(--accent-fg); border-color: rgba(10,10,10,0.25); }
  .final-cta .btn-ghost:hover { border-color: var(--accent-fg); }
